privacy:
  title: "Privacy"
  # Markdown. {names} works here.
  body: |
    This website is for guests of {names}'s wedding. It is run by the two of us, not by a company.

    ## What we keep

    - The names of the people we've invited, grouped by household.
    - Email addresses, so we can send save the dates and invitations.
    - Postal addresses you give us, so we can post your invitation.
    - Your replies: who can come, meal choices, dietary needs and any notes you leave us.
    - When your invitation link was opened, when an email from us was opened, and when you added the events to your calendar, so we know who has seen what.

    ## How we use it

    Only to organise the wedding and the events around it, and to keep in touch with you about them. We don't sell or share it, and we don't use it for advertising.

    ## Who can see it

    Just the two of us and a few family members helping with planning. Your personal link only shows your own household's details, so please don't share it.

    ## Email and Google

    We send our emails through our own Gmail account. This website has permission only to send email from that account: it cannot read, change or delete anything in it. Use of information received from Google APIs adheres to the [Google API Services User Data Policy](https://developers.google.com/terms/api-services-user-data-policy), including the Limited Use requirements.

    Address search on the RSVP page uses Google's address service; what you type there is sent to Google to find matching addresses.

    ## How long we keep it

    Until after the wedding celebrations, then we delete it.

    ## Questions or removal

    Email us at us (see your invitation) and we'll answer, correct or delete your details.

