# Every sentence guests read: the website, emails, printed cards and form messages.
#
# Edit the wording here, not in the code. Your own copy lives next to wedding.toml (on the server:
# /etc/rsvp/copy.yaml). Anything you leave out there falls back to this file.
#
# Placeholders in {braces} are filled in for you. Which ones work is noted beside each line:
#   {names}     "Alex & Sam"           {a_first} {b_first}   first names
#   {date}      "Saturday 12 June 2027" (long)   {date_medium} "12 June 2027"
#   {location}  "Hobart, Tasmania"     {deadline}  RSVP-by date, "1 April 2027"
#   {greeting}  the household, "Ben, Sarah & Tom"
# **double stars** make words bold on the website.
# A line break inside a "|" block becomes a line break on the card.

# Short notes that print on cards and show on guest pages.
